[package]
name = "engine"
description = "The mixer's pure core: what the audio thread runs, with no device, socket or Node in it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kernels = { workspace = true }
opus = "0.4.0"
rtrb = "0.4.1"
rubato = "5.0.1"
symphonia = { version = "0.6.1", features = ["all"] }
triple_buffer = "9.0.0"

[dev-dependencies]
assert_no_alloc = "1.1"
kernels = { workspace = true, features = ["fixtures"] }
