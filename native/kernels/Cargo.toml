[package]
name = "kernels"
description = "The C++ DSP leaves behind extern \"C\", and the safe Rust the engine calls them through."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
realfft = "3.5.1"

[features]
# Synthetic signals, a sung vowel among them, for tests, benches and tools in every crate
fixtures = []

[build-dependencies]
cc = "1"

[dev-dependencies]
assert_no_alloc = "1.1"
# The examples sing with the fixtures; a test build has them anyway
kernels = { path = ".", features = ["fixtures"] }
