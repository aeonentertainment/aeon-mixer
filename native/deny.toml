# cargo deny check: what CI lets into the addon we ship. A new advisory, licence or source
# fails the build until a person decides.

[graph]
all-features = true

[advisories]
# An unmaintained crate fails only when we depend on it directly, so a transitive one never
# turns an unrelated PR red. A yanked crate always fails.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# What the addon's dependencies are under today. MPL-2.0 is symphonia's and triple_buffer's,
# file-level copyleft that an MIT package may ship as long as their source stays theirs.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates depend on each other by path, which reads as a wildcard
allow-wildcard-paths = true
# devices names windows-core for the `implement` macro, whose traits must be the ones `windows`
# implements. Two versions build on Linux and break the Windows build, so a bump to either crate
# fails here until both move together.
deny = [{ crate = "windows-core", deny-multiple-versions = true }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
