[workspace]
resolver = "3"
members = ["engine", "kernels", "node", "devices", "transport", "tools/measure-corrector"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
devices = { path = "devices" }
engine = { path = "engine" }
kernels = { path = "kernels" }
transport = { path = "transport" }

# DSP at -O0 makes the debug test run crawl; the C++ kernels are optimised in every profile too
[profile.dev.package.kernels]
opt-level = 2
