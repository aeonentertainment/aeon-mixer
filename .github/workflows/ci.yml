# One job per OS, four gates each: cargo (fmt, clippy, test), the addon build, vp check and
# vp test, then vp pack. The "CI" gate job is the one name branch protection requires.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: blacksmith-4vcpu-ubuntu-2404
          - name: darwin-arm64
            os: macos-15
          - name: win32-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: native
      - run: cargo fmt --check
        working-directory: native
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: native
      - run: cargo test
        working-directory: native
      # The device backends sit behind a feature and no runner has a sound card, so CI lints them
      # and links measure-sink on each OS without running either
      - run: cargo clippy -p devices --all-targets --features hardware -- -D warnings
        working-directory: native
      - run: cargo build -p devices --features hardware --bin measure-sink
        working-directory: native
      - run: vp run build:native
      - run: vp check
      - run: vp test
      - run: vp pack
      # The addon per platform, so a release can gather them into the platform packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-${{ matrix.name }}
          path: native/binding/*.node
          if-no-files-found: error

  ci:
    name: CI
    needs: build
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - run: test "${{ needs.build.result }}" = success
