# One job per OS, four gates each: cargo (fmt, clippy, test), the addon build, vp check and
# vp test, then vp pack. The "CI" gate job is the one name branch protection requires.
#
# A fork's pull request never runs on our own runner box: it would run a stranger's code there.
# Every runs-on sends a fork to a GitHub-hosted runner. A fork can rewrite this file, so the
# repository setting that holds outside contributors' runs for approval is the real lock, and
# this is what an approved run then gets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Mac and Windows only by hand: their minutes count 10x and 2x, and at every push they spent
        # a month's included minutes in six days.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"name":"linux-x64"},{"name":"darwin-arm64","os":"macos-15"},{"name":"win32-x64","os":"windows-2025"}]' || '[{"name":"linux-x64"}]') }}
    runs-on: ${{ matrix.os || (!github.event.pull_request.head.repo.fork && vars.LINUX_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
      - run: cargo fmt --check
        working-directory: native
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: native
      - run: cargo test
        working-directory: native
      # The device backends sit behind a feature and no runner has a sound card, so CI lints them
      # and links measure-sink on each OS without running either
      - run: cargo clippy -p devices --all-targets --features hardware -- -D warnings
        working-directory: native
      - run: cargo build -p devices --features hardware --bin measure-sink
        working-directory: native
      - run: vp run build:native
      - run: vp check
      - run: vp test
      - run: vp pack
      # The addon per platform, so a release can gather them into the platform packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-${{ matrix.name }}
          path: native/binding/*.node
          if-no-files-found: error

  ci:
    name: CI
    needs: build
    if: always()
    runs-on: ${{ (!github.event.pull_request.head.repo.fork && vars.LINUX_RUNNER) || 'ubuntu-24.04' }}
    steps:
      - run: test "${{ needs.build.result }}" = success
